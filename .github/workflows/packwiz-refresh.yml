name: Packwiz Refresh

on:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run packwiz refresh
        id: refresh
        run: |
          chmod +x packwiz
          ./packwiz refresh
          if git diff --quiet index.toml pack.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated files
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.toml pack.toml
          git commit -m "chore: refresh packwiz index"
          git push

      - name: Wait for GitHub Pages sync
        if: steps.refresh.outputs.changed == 'true'
        run: sleep 30

      - name: Download packwiz-installer-bootstrap
        if: steps.refresh.outputs.changed == 'true'
        run: |
          curl -L -o /tmp/packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar

      - name: Run packwiz-installer-bootstrap
        if: steps.refresh.outputs.changed == 'true'
        working-directory: /tmp
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          java -jar packwiz-installer-bootstrap.jar https://teamaurorisla.github.io/BTW-Packwiz/pack.toml

      - name: Upload downloaded files
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: btw-packwiz-downloads
          path: |
            /tmp/mods/
            /tmp/resourcepacks/
            /tmp/shaderpacks/
          if-no-files-found: warn
