name: Packwiz Refresh

on:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run packwiz refresh
        id: refresh
        run: |
          chmod +x packwiz
          ./packwiz refresh
          if git diff --quiet index.toml pack.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated files
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.toml pack.toml
          git commit -m "chore: refresh packwiz index"
          git push

      - name: Download and run packwiz-installer-bootstrap
        run: |
          curl -L -o /tmp/packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          java -jar /tmp/packwiz-installer-bootstrap.jar pack.toml

      - name: Collect downloaded files
        run: |
          mkdir -p /tmp/artifact-downloads/mods
          mkdir -p /tmp/artifact-downloads/resourcepacks
          mkdir -p /tmp/artifact-downloads/shaderpacks
          find mods/ -maxdepth 1 -type f ! -name '*.pw.toml' -exec cp {} /tmp/artifact-downloads/mods/ \;
          find resourcepacks/ -maxdepth 1 -type f ! -name '*.pw.toml' -exec cp {} /tmp/artifact-downloads/resourcepacks/ \;
          find shaderpacks/ -maxdepth 1 -type f ! -name '*.pw.toml' -exec cp {} /tmp/artifact-downloads/shaderpacks/ \;

      - name: Upload downloaded files
        uses: actions/upload-artifact@v4
        with:
          name: btw-packwiz-downloads
          path: /tmp/artifact-downloads/
          if-no-files-found: warn
